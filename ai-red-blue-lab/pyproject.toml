[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-red-blue-lab"
version = "0.1.0"
description = "Defensive static-analysis MVP for an isolated AI red-vs-blue security lab"
requires-python = ">=3.11"
dependencies = [
  "pefile>=2024.8.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
redblue-analyze = "analyzer.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
