name: analyzer tests

on:
  push:
    branches: [main]
    paths:
      - "ai-red-blue-lab/**"
      - ".github/workflows/analyzer-tests.yml"
  pull_request:
    paths:
      - "ai-red-blue-lab/**"
      - ".github/workflows/analyzer-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: ai-red-blue-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ai-red-blue-lab/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
